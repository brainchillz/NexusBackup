<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · NexusBackup</title>
<link rel="stylesheet" href="/static/app.css">
<script>
// Before first paint: dark/light class and the chosen theme (same contract as
// Nexus Dashboard: html.theme-light, data-theme, data-theme-variant). Only
// same-origin /themes/<id>/ stylesheets are accepted from the cache.
(function () { try {
  var h = document.documentElement;
  if (localStorage.getItem('theme') === 'light') h.classList.add('theme-light');
  var t = JSON.parse(localStorage.getItem('hvbTheme.v1') || 'null');
  if (!t || !/^[a-z][a-z0-9-]{1,31}$/.test(t.id || '')) return;
  h.setAttribute('data-theme', t.id);
  if (t.variant && /^[a-z][a-z0-9-]{0,31}$/.test(t.variant)) h.setAttribute('data-theme-variant', t.variant);
  if (t.modes && t.modes.indexOf('light') < 0) h.classList.remove('theme-light');
  if (t.modes && t.modes.indexOf('dark') < 0) h.classList.add('theme-light');
  var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'theme-css';
  l.href = '/themes/' + t.id + '/theme.css' + (t.v ? '?v=' + encodeURIComponent(t.v) : '');
  document.head.appendChild(l);
  if (t.js) { var s = document.createElement('script'); s.id = 'theme-js'; s.src = '/themes/' + t.id + '/theme.js' + (t.v ? '?v=' + encodeURIComponent(t.v) : ''); s.defer = true; document.head.appendChild(s); }
} catch (e) {} })();
window.USER = {{ user | tojson }};
window.THEMES = {{ themes | tojson }};
</script>
<script src="/static/app.js" defer></script>
</head>
<body>
<nav class="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <h1>NexusBackup</h1>
      <p class="subtitle"><strong>hvbackup</strong> · v{{ version }}</p>
    </div>
  </div>
  <ul class="nav-list">
    {% for cat, items in nav %}
    <li class="nav-cat">{{ cat }}</li>
    {% for href, label in items %}
    <li><a href="{{ href }}" class="{% if path == href or (href != '/' and path.startswith(href)) %}active{% endif %}">{{ label }}</a></li>
    {% endfor %}
    {% endfor %}
  </ul>
  <div class="sidebar-footer">
    <div class="footer-account">
      <span class="who-name">{{ user.username }}</span>
      <span class="badge plain">{{ user.role }}</span>
      <button class="linkbtn" id="logout">Sign out</button>
    </div>
    <div class="notice" id="sys-notice" hidden></div>
    <div class="appearance" id="appearance">
      <button class="linkbtn" id="mode-toggle" title="Switch between dark and light">Light mode</button>
      <select id="theme-pick" title="Theme" hidden></select>
      <select id="variant-pick" title="Theme variant" hidden></select>
    </div>
  </div>
</nav>
<div class="main">
  <div class="machine-strip">
    <span class="ms-host">{{ title }}</span>
    <span id="strip-status"></span>
    <span class="ms-right" id="strip-clock"></span>
  </div>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('logout').onclick = async () => { await api('POST', '/api/v1/auth/logout'); location.href = '/login'; };
  initAppearance();
  const strip = document.getElementById('strip-status');
  pollWhile(async () => {
    try {
      const s = await api('GET', '/api/v1/status');
      window.SERVER_TZ = s.timezone;
      strip.innerHTML = `<span class="${s.proxies_online ? 'ms-ok' : 'ms-bad'}">${s.proxies_online} prox${s.proxies_online === 1 ? 'y' : 'ies'}</span> · ${s.running_tasks} running · ${s.failed_runs_24h ? '<span class="ms-bad">' + s.failed_runs_24h + ' failed 24h</span>' : '<span class="ms-ok">no failures 24h</span>'} · repo ${esc(fmtBytes(s.repository.free_bytes))} free`;
      const notes = [];
      if (s.restart_pending) notes.push('Restart pending: the server exits when no task runs.');
      else if (s.catalog_restore_pending) notes.push('A catalog restore is staged; <a href="/settings#catalog">restart to apply it</a>.');
      if (s.damaged_points) notes.push(`<a href="/restore-points">${s.damaged_points} restore point${s.damaged_points === 1 ? '' : 's'} failed verification</a>.`);
      if (s.certificate && s.certificate.restart_needed) notes.push('A new certificate is installed; <a href="/settings#certificate">restart to serve it</a>.');
      if (s.certificate && s.certificate.days_left < 30) notes.push(`<a href="/settings#certificate">The server certificate expires in ${s.certificate.days_left} day${s.certificate.days_left === 1 ? '' : 's'}</a>.`);
      if (s.update && s.update.available) notes.push(`<a href="${esc(s.update.url || '#')}" target="_blank" rel="noopener">Version ${esc(s.update.latest)} is available</a> (this server runs ${esc(s.version)}).`);
      const n = document.getElementById('sys-notice'); n.hidden = !notes.length; n.innerHTML = notes.join('<br>');
    } catch (e) { strip.textContent = ''; }
    return true;
  }, 30000);
});
</script>
{% block script %}{% endblock %}
</body>
</html>
