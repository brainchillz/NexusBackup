[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hvbackup"
version = "0.1.0"
description = "Hypervisor backup server: backs up running VMs from vCenter, ESXi and Proxmox into one deduplicated store on Linux"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "pyvmomi>=8.0",
    "requests>=2.31",
    "blake3>=0.4",
    "zstandard>=0.22",
    "croniter>=2.0",
    "cryptography>=42",
]

[project.scripts]
hvbackup = "hvbackup.cli.main:main"
hvbackup-agent = "hvbackup.agent.proxy_agent:main"

[tool.setuptools.packages.find]
include = ["hvbackup*"]

[tool.setuptools.package-data]
hvbackup = ["web/templates/*.html", "web/static/*"]
