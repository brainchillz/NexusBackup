<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · NexusBackup</title>
<link rel="stylesheet" href="/static/app.css">
<script>
(function () { try {
  var h = document.documentElement;
  if (localStorage.getItem('theme') === 'light') h.classList.add('theme-light');
  var t = JSON.parse(localStorage.getItem('hvbTheme.v1') || 'null');
  if (!t || !/^[a-z][a-z0-9-]{1,31}$/.test(t.id || '')) return;
  h.setAttribute('data-theme', t.id);
  if (t.variant && /^[a-z][a-z0-9-]{0,31}$/.test(t.variant)) h.setAttribute('data-theme-variant', t.variant);
  if (t.modes && t.modes.indexOf('light') < 0) h.classList.remove('theme-light');
  if (t.modes && t.modes.indexOf('dark') < 0) h.classList.add('theme-light');
  var l = document.createElement('link'); l.rel = 'stylesheet'; l.id = 'theme-css';
  l.href = '/themes/' + t.id + '/theme.css' + (t.v ? '?v=' + encodeURIComponent(t.v) : '');
  document.head.appendChild(l);
} catch (e) {} })();
window.USER = { username: '', role: 'viewer' };
window.THEMES = {{ themes | tojson }};
</script>
<script src="/static/app.js" defer></script>
</head>
<body class="login-page">
<div class="login">
  <div class="login-box">
    <h1>NexusBackup</h1>
    <p class="subtitle"><strong>hvbackup</strong> · v{{ version }}</p>
    {% if setup %}
    <p class="muted">This server has no account yet. Create the first administrator; more users come from Settings afterwards.</p>
    <form id="f" data-setup="1">
      <label class="f"><span>Username</span><input name="username" autocomplete="username" pattern="[a-z0-9][a-z0-9._-]*" value="admin" autofocus required></label>
      <label class="f"><span>Password (8 characters or more)</span><input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label class="f"><span>Repeat password</span><input name="password2" type="password" autocomplete="new-password" minlength="8" required></label>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit">Create administrator</button>
    </form>
    {% else %}
    <form id="f">
      <label class="f"><span>Username</span><input name="username" autocomplete="username" autofocus required></label>
      <label class="f"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    {% endif %}
  </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const f = document.getElementById('f');
  f.onsubmit = async e => {
    e.preventDefault();
    document.getElementById('err').textContent = '';
    try {
      if (f.dataset.setup) {
        if (f.password.value !== f.password2.value) throw new Error('the passwords differ');
        await api('POST', '/api/v1/auth/setup', { username: f.username.value, password: f.password.value });
      } else {
        await api('POST', '/api/v1/auth/login', { username: f.username.value, password: f.password.value });
      }
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next.startsWith('/') ? next : '/';
    } catch (err) { document.getElementById('err').textContent = err.message; }
  };
});
</script>
</body>
</html>
